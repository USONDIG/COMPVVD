{% extends "base.html" %}{% block content %}<a href="/c/{{c.id}}">← {{c.name}}</a><h1>Historique des opérations</h1><p class="muted">200 opérations les plus récentes. Horodatage Unix UTC conservé en base.</p><section class="panel scroll"><table><thead><tr><th>Horodatage</th><th>Auteur</th><th>Action</th><th>Détail</th></tr></thead><tbody>{% for e in events %}<tr><td data-date="{{e.stamp}}">{{e.stamp}}</td><td>{{e.actor_name}}</td><td>{{e.action}}</td><td><details><summary>Détails</summary><pre>{{e.detail}}</pre></details></td></tr>{% endfor %}</tbody></table></section>{% endblock %}
